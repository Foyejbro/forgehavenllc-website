<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge Haven Admin</title>
<style>:root{--bg:#070a08;--p:#0e1410;--a:#3bdc2a;--m:#9faf9f;--l:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,Arial}.w{max-width:1180px;margin:auto;padding:28px 16px}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:20px}.login{max-width:420px;margin:12vh auto}.f{display:flex;flex-direction:column;gap:7px;margin:12px 0}input{background:#080c09;border:1px solid var(--l);border-radius:12px;padding:13px;color:#fff}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--a);font-weight:900;cursor:pointer}.ghost{background:transparent;color:#9faf9f;border:1px solid var(--l)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--l);vertical-align:top}th{color:var(--m)}.pill{padding:5px 8px;border-radius:999px;font-size:10px;background:rgba(255,193,7,.12);color:#ffd86e}.ap{background:rgba(59,220,42,.12);color:#8cff70}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}.muted{color:var(--m)}a{color:#8cff70}@media(max-width:760px){table{min-width:900px}.scroll{overflow:auto}}</style></head>
<body><div class="w"><div id="login" class="card login"><h2>Admin Login</h2><div class="f"><label>Email</label><input id="email"></div><div class="f"><label>Password</label><input id="password" type="password"></div><button class="btn" onclick="login()">Login</button><p id="le" style="color:#ff9292"></p></div>
<div id="dash" style="display:none"><div class="top"><div><div class="muted" style="font-size:12px">FORGE HAVEN LLC</div><h1 style="margin:4px 0">Orders</h1></div><button class="btn ghost" onclick="logout()">Logout</button></div><div class="card"><div class="scroll"><table><thead><tr><th>Order</th><th>Client</th><th>Service</th><th>Payment</th><th>Proof</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div>
<script>
async function me(){const r=await fetch('/api/admin/me');const j=await r.json();if(j.authenticated){login.style.display='none';dash.style.display='block';load()} }
async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok){le.textContent=j.error;return}document.getElementById('login').style.display='none';dash.style.display='block';load()}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}
async function load(){const r=await fetch('/api/admin/orders');if(r.status===401)return location.reload();const a=await r.json();rows.innerHTML=a.map(o=>`<tr><td><b>${o.order_no}</b><br><span class="muted">${new Date(o.created_at).toLocaleString()}</span></td><td>${o.client_name}<br><span class="muted">${o.client_email}</span><br><span class="muted">${o.client_type}</span></td><td>${o.service}<br><span class="muted">Service date: ${o.service_date}</span></td><td>BDT ${Number(o.advance_amount).toLocaleString()} / ${Number(o.total_amount).toLocaleString()}<br><span class="muted">${o.payment_method} • ${o.trx_id||'No ref'}</span><br><span class="muted">${o.sender_name||''} ${o.sender_number||''}</span></td><td><a target="_blank" href="${o.proof_path}">View proof</a></td><td><span class="pill ${o.status==='APPROVED'?'ap':''}">${o.status}</span>${o.invoice_path?`<br><a target="_blank" href="${o.invoice_path}">Invoice PDF</a>`:''}</td><td>${o.status==='APPROVED'?'Approved':`<button class="btn" onclick="approve(${o.id},this)">Approve & Send Invoice</button>`}</td></tr>`).join('')}
async function approve(id,btn){if(!confirm('Verify the payment proof first. Approve this payment and send invoice?'))return;btn.disabled=true;btn.textContent='Approving...';const r=await fetch('/api/admin/orders/'+id+'/approve',{method:'POST'});const j=await r.json();if(!r.ok){alert(j.error||'Failed');btn.disabled=false;btn.textContent='Approve & Send Invoice';return}load()}
me()
</script></body></html>
