name = "forge-haven-store-api"
main = "index.mjs"
compatibility_date = "2026-09-01"

[vars]
STORE_ORIGIN = "https://store.forgehavenllc.org"
RELAY_INSTRUCTIONS = "Contact support@forgehavenllc.org with your order ID to receive a Relay payment request."

[[d1_databases]]
binding = "DB"
database_name = "forge-haven-store"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "forge-haven-private-files"
